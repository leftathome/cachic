name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, for the long fuzz runs.
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Test
        run: cargo nextest run --all-features

  perf:
    name: Performance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Warm hit throughput
        # Shared CI runners are slower and noisier than a benchmark host, so the floor here is a
        # catastrophic-regression backstop rather than the real nginx-parity floor. A dedicated
        # runner should raise both to the measured figures from TASK-25.
        env:
          CACHIC_PERF_FLOOR_GBPS: "0.4"
          CACHIC_PERF_TARGET_GBPS: "1.0"
        run: cargo nextest run --release --test perf_gate --no-capture

  deny:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [range_header, content_range, config_units, cache_domains]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # The `@cargo-fuzz` shorthand is not a real alias; only some tools have one, and using it
      # installed nothing while the workflow still reported the step as successful.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Verify cargo-fuzz is present
        run: cargo fuzz --version
      - name: Fuzz ${{ matrix.target }}
        # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml, which pins stable and would otherwise
        # win over the nightly this action installed - libFuzzer needs -Z, which stable rejects.
        # The target is explicit because cargo-fuzz's host detection picked musl here, which has
        # no sanitizer support. RUSTFLAGS is cleared because cargo-fuzz composes its own and the
        # workflow-level -D warnings gets appended into them.
        env:
          RUSTUP_TOOLCHAIN: nightly
          RUSTFLAGS: ""
        run: |
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- \
            -max_total_time=${{ github.event_name == 'schedule' && 1800 || 60 }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint charts/cachic
      - name: Render with defaults
        run: helm template cachic charts/cachic > /dev/null
      - name: Render with every optional feature enabled
        # The conditional templates are the ones that rot unnoticed, because the default render
        # never exercises them.
        run: |
          helm template cachic charts/cachic \
            --set admin.token=secret \
            --set metrics.serviceMonitor.enabled=true \
            --set hostNetwork=true \
            --set persistence.existingClaim=preexisting \
            --set serviceRules.steam.keep_query=true > /dev/null
      - name: Validate rendered manifests against the Kubernetes schema
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          entrypoint: /bin/sh
          args: >-
            -c "helm template cachic charts/cachic | kubeconform -strict -summary
            -schema-location default
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'"

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: rustdoc
        run: cargo doc --no-deps --all-features
