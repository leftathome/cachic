{{- if .Values.metrics.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cachic.fullname" . }}-dashboard
  labels:
    {{- include "cachic.labels" . | nindent 4 }}
    {{- with .Values.metrics.grafanaDashboard.labels }}{{- toYaml . | nindent 4 }}{{- end }}
data:
  cachic.json: |
{{ .Files.Get "dashboards/cachic.json" | indent 4 }}
{{- end }}
