# The admin surface, deliberately a separate ClusterIP service. It carries purge and drain and
# must not be reachable from the LAN through the load balancer.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cachic.fullname" . }}-admin
  labels:
    {{- include "cachic.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cachic.selectorLabels" . | nindent 4 }}
  ports:
    - name: admin
      port: {{ .Values.admin.port }}
      targetPort: admin
      protocol: TCP
