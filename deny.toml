# cargo-deny configuration. See TASK-01.
# Policy: permissive licences only, no known advisories, no duplicate major versions
# without a written reason.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-musl" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste 1.0.15 is unmaintained (proc-macro only, no runtime code). It reaches us solely
    # through foyer-memory, so we cannot drop it without dropping foyer. Revisit when foyer
    # releases a version without it; tracked as an M0 finding in docs/adr/0003.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Boost Software License: permissive, no attribution requirement in binaries (xxhash-rust).
    "BSL-1.0",
    # Community Data License Agreement, permissive. This covers webpki-roots' certificate data
    # rather than code; it is the standard licence for Mozilla's root store.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace carry no version requirement by design.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
