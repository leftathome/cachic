[workspace]
resolver = "2"
members = ["crates/cachic", "crates/cachic-testkit"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/leftathome/cachic"
authors = ["Steven Wagner <leftathome@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1"] }
http-body-util = "0.1"
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# Benchmarks and the spike want release-grade codegen with symbols intact.
[profile.bench]
lto = true
codegen-units = 1
