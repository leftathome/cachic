[workspace]
resolver = "2"
members = ["crates/cachic", "crates/cachic-testkit"]

[workspace.package]
version = "0.1.0-rc1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/leftathome/cachic"
authors = ["Steven Wagner <leftathome@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1"] }
http-body-util = "0.1"
futures-util = "0.3"
foyer = "0.22"
blake3 = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "stream"] }
dashmap = "6"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
regex = "1"
# `default-features = false` drops the `system-config` feature deliberately: it removes the
# constructors that read /etc/resolv.conf, making use of the system resolver a compile error.
# See upstream::resolver and ADR 0008.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
redb = "4"
libc = "0.2"
proptest = "1"
arc-swap = "1"
prometheus = { version = "0.14", default-features = false }
mixtrics = { version = "0.2", features = ["prometheus_0_14"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# Benchmarks and the spike want release-grade codegen with symbols intact.
[profile.bench]
lto = true
codegen-units = 1
