[package]
name = "cachic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "HTTP caching proxy for game-distribution and OS-update CDN traffic"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
futures-util.workspace = true
foyer.workspace = true
blake3.workspace = true
xxhash-rust.workspace = true
reqwest.workspace = true
dashmap.workspace = true
clap.workspace = true

# The measurement harness uses the testkit's mock origin, so it is a normal dependency of that
# binary only. Cargo has no per-binary deps, so it is declared here and gated by the bin target.
[[bin]]
name = "cachic"
path = "src/main.rs"

[[bin]]
name = "spike"
path = "src/bin/spike.rs"

[[bin]]
name = "foyerprobe"
path = "src/bin/foyerprobe.rs"

[[bin]]
name = "measure"
path = "src/bin/measure.rs"
required-features = ["measure"]

[features]
default = []
measure = ["dep:cachic-testkit"]

[dependencies.cachic-testkit]
path = "../cachic-testkit"
optional = true

[dev-dependencies]
cachic-testkit = { path = "../cachic-testkit" }
reqwest.workspace = true
tokio.workspace = true
