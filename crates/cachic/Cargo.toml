[package]
name = "cachic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "HTTP caching proxy for game-distribution and OS-update CDN traffic"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
futures-util.workspace = true
foyer.workspace = true
blake3.workspace = true
xxhash-rust.workspace = true
reqwest.workspace = true
dashmap.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
regex.workspace = true
hickory-resolver.workspace = true
redb.workspace = true

[[bin]]
name = "cachic"
path = "src/main.rs"

[[bin]]
name = "spike"
path = "src/bin/spike.rs"

# The measurement harness and the foyer probe need the testkit's mock origin. They live as
# examples rather than binaries so that dependency stays a dev-dependency: a publishable crate
# cannot carry a path dependency, and the testkit is deliberately unpublishable.
[[example]]
name = "config-reference"
path = "examples/config-reference.rs"

[[example]]
name = "measure"
path = "examples/measure.rs"

[[example]]
name = "foyerprobe"
path = "examples/foyerprobe.rs"

[features]
default = []
# Exposes test helpers to integration tests and other crates' tests.
test-support = []

[dev-dependencies]
cachic = { path = ".", features = ["test-support"] }
cachic-testkit = { path = "../cachic-testkit" }
reqwest.workspace = true
tokio.workspace = true
